[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cuprate"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "networkx",
    "psutil",
    "mpi4py",
]

[tool.setuptools.packages.find]
where = ["src"]
